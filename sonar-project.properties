# ====================================================================
# Project Identification
# ====================================================================
sonar.projectKey=nitricx_OrganizadorCursada
sonar.projectName=OrganizadorCursada
sonar.sourceEncoding=UTF-8

# ====================================================================
# Type-Informed TypeScript Analysis (Required for Taint / SAST Data-Flow)
# ====================================================================
sonar.typescript.tsconfigPath=tsconfig.app.json

# ====================================================================
# Source and Test Inclusions / Exclusions
# ====================================================================
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts

sonar.exclusions=\
  node_modules/**,\
  dist/**,\
  coverage/**,\
  public/**,\
  src/environments/**,\
  scripts/**,\
  **/*.spec.ts,\
  **/*.css

# ====================================================================
# Code Coverage Reports (Vitest LCOV)
# ====================================================================
sonar.javascript.lcov.reportPaths=coverage/OrganizadorCursada/lcov.info,coverage/lcov.info

# Exclude bootstrap, routing, boilerplate, and presentation UI components from coverage metrics
# (Per Inviolable Rule #2: UI components do NOT require unit tests; domain services require 100% test coverage)
sonar.coverage.exclusions=\
  src/main.ts,\
  src/app/app.config.ts,\
  src/app/app.routes.ts,\
  src/app/features/**/*.html,\
  src/app/features/**/*.component.ts,\
  src/app/shared/**/*.html,\
  src/app/shared/**/*.component.ts,\
  src/environments/**,\
  scripts/**

# Exclude static data seeds and constants from code duplication checks
sonar.cpd.exclusions=\
  scripts/seed-data/**,\
  src/app/constants/**

# ====================================================================
# Quality Gate Enforcement
# ====================================================================
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
