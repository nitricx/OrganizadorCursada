<div
  [class]="'materia ' + course().status + getHighlightClass()"
  [attr.id]="'mat-' + course().id"
  [ngStyle]="
    allRequirementsMet() && course().status === 'pending'
      ? { outline: '2px dashed #185fa5', 'outline-offset': '1px', background: '#e8e7e0' }
      : {}
  "
  (click)="onCardClick()"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()"
  role="button"
  tabindex="0"
>
  <span>{{ course().name }}</span>
  @if (course().status === 'approved') {
    <span class="tag">✓ aprobada</span>
  } @else if (course().status === 'coursed') {
    <span class="tag">● cursada</span>
  }
</div>
