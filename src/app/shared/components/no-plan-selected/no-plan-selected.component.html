<div class="empty-state-container">
  <div class="empty-state-card glass-panel">
    <div class="icon-hero">
      <div class="icon-ring">
        <mat-icon class="hero-mat-icon">{{ icon() }}</mat-icon>
      </div>
    </div>

    <h2 class="empty-state-title">{{ title() }}</h2>
    <p class="empty-state-description">{{ description() }}</p>

    <div class="actions-grid">
      <!-- Card 1: Open Plan Hub -->
      <div class="action-card primary-card" (click)="onOpenPlanHub()">
        <div class="card-badge">Recomendado</div>
        <div class="card-icon-wrapper">
          <mat-icon>storefront</mat-icon>
        </div>
        <div class="card-text">
          <h3>Explorar Plan Hub</h3>
          <p>Buscá y suscribite al plan oficial de tu universidad.</p>
        </div>
        <button mat-flat-button color="primary" class="action-btn" (click)="$event.stopPropagation(); onOpenPlanHub()">
          <span>Explorar Planes</span>
          <mat-icon>arrow_forward</mat-icon>
        </button>
      </div>

      <!-- Card 2: Load Demo Plan -->
      <div class="action-card" (click)="onLoadDemoPlan()">
        <div class="card-icon-wrapper">
          <mat-icon>bolt</mat-icon>
        </div>
        <div class="card-text">
          <h3>Cargar Plan Demo</h3>
          <p>Probá las funciones interactivas con un plan de ejemplo.</p>
        </div>
        <button mat-stroked-button color="primary" class="action-btn" (click)="$event.stopPropagation(); onLoadDemoPlan()">
          <span>Cargar Demo</span>
        </button>
      </div>
    </div>
  </div>
</div>
