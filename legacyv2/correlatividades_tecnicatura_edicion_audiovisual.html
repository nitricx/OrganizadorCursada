<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tecnicatura en Edición Audiovisual — Correlatividades</title>
    <link
      rel="stylesheet"
      href="correlatividades_tecnicatura_edicion_audiovisual.css"
    />
  </head>
  <body>
    <div class="wrap">
      <h1>
        Tecnicatura en Edición Audiovisual
        <button class="reset-btn" id="resetBtn">Reiniciar</button>
      </h1>

      <div class="legend">
        <div class="leg-item">
          <div
            class="leg-dot"
            style="background: #e8e7e0; border: 1px solid #888"
          ></div>
          <span>Pendiente</span>
        </div>
        <div class="leg-item">
          <div
            class="leg-dot"
            style="background: #e6f1fb; border: 1px solid #185fa5"
          ></div>
          <span>Cursada</span>
        </div>
        <div class="leg-item">
          <div
            class="leg-dot"
            style="background: #e1f5ee; border: 1px solid #0f6e56"
          ></div>
          <span>Aprobada</span>
        </div>
        <div class="leg-item">
          <div
            class="leg-dot"
            style="
              outline: 2px dashed #185fa5;
              outline-offset: 1px;
              background: #e8e7e0;
            "
          ></div>
          <span>Disponible para cursar</span>
        </div>
        <span style="color: #aaa; font-style: italic"
          >· Clic: cambia estado &nbsp;· Hover: ver correlativas</span
        >
      </div>

      <div class="grid" id="grid"></div>
      <div class="info-bar" id="info">
        Pasá el cursor sobre una materia para ver qué requiere y qué habilita.
      </div>
    </div>

    <script src="correlatividades_tecnicatura_edicion_audiovisual.js"></script>
  </body>
</html>
