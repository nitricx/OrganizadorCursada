<div class="academic-calendar">
  @if (toastMessage()) {
    <div class="move-toast">{{ toastMessage() }}</div>
  }
  <div class="page-header">
    <h1>Calendario Académico</h1>
    @if (planId()) {
      <h2 class="plan-title">{{ planId() }}</h2>
    }
  </div>
  @for (item of displaySemesters(); track item.id; let i = $index; let last = $last) {
    <section class="semester-section">
      <h2 class="semester-title">{{ item.label }}</h2>
      <app-calendar
        [coursesOverride]="item.courses"
        [showHeader]="false"
        [isEditable]="isEditable()"
        [clickTogglesStatus]="false"
        (lessonMoveRequested)="onLessonMoveRequested($event, i)"
      />
    </section>
    @if (isEditable() && (i + 1) % 2 === 0) {
      <div class="add-semester-divider">
        <button
          class="add-semester-btn"
          (click)="addCalendarAfter(item.id)"
          aria-label="Agregar semestres"
        >
          <span>+</span>
        </button>
      </div>
    }
  }
</div>
