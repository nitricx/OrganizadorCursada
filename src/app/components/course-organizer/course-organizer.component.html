<div class="course-organizer">
  <div class="header">
    <div class="header-title-group">
      <h1>Plan de Cursada</h1>
      <p class="subtitle">Gestioná el estado de tus materias y consultá correlatividades</p>
    </div>
    <div class="header-actions">
      <div class="progress-badge">
        <span class="progress-text">Avance: {{ progressPercent() }}% ({{ approvedCount() }}/{{ totalCount() }} materias)</span>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" [style.width.%]="progressPercent()"></div>
        </div>
      </div>
      <button class="reset-btn" (click)="onReset()" title="Reiniciar progreso">Reiniciar</button>
    </div>
  </div>

  <app-course-organizer-legend />

  <app-course-grid
    [courses]="courseService.courses()"
    [selectedIds]="courseService.selectedIds()"
    (cardClicked)="onCourseCardClicked($event)"
    (changeLessonClicked)="onChangeLessonRequested($event)"
    (mouseEntered)="onMouseEntered($event)"
    (mouseLeft)="onMouseLeft()"
  />

  <div class="info-bar" [innerHTML]="infoMessage()"></div>

  <app-lesson-selector-modal
    [course]="selectedCourseForModal()"
    [isOpen]="isModalOpen()"
    (closed)="closeModal()"
    (lessonSelected)="onLessonSelected($event)"
  />
</div>
