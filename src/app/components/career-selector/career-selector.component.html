<div class="career-selector-container">
  <button
    mat-button
    [matMenuTriggerFor]="careerMenu"
    class="career-chip-btn"
    aria-label="Seleccionar plan de estudio"
  >
    <span class="career-chip-text">{{ activeCareerName() }}</span>
    <mat-icon class="career-chip-arrow">keyboard_arrow_down</mat-icon>
  </button>

  <mat-menu #careerMenu="matMenu" class="career-selector-menu" xPosition="after">
    <div class="menu-header-title">Planes de Estudio</div>
    @for (career of careerService.careers(); track career.id) {
      <button
        mat-menu-item
        [class.active-career-item]="career.id === careerService.selectedCareerId()"
        (click)="onCareerChange(career.id)"
      >
        <mat-icon class="career-check-icon">
          {{ career.id === careerService.selectedCareerId() ? 'radio_button_checked' : 'radio_button_unchecked' }}
        </mat-icon>
        <div class="career-option-details">
          <span class="career-option-name">{{ career.name }}</span>
          @if (career.university) {
            <span class="career-option-univ">{{ career.university }}</span>
          }
        </div>
      </button>
    }
    <mat-divider></mat-divider>
    <button mat-menu-item (click)="triggerFileInput()" class="import-menu-item">
      <mat-icon class="import-icon">upload_file</mat-icon>
      <span>Importar plan desde JSON...</span>
    </button>
  </mat-menu>

  <input
    #fileInput
    type="file"
    accept=".json"
    class="hidden-file-input"
    (change)="onFileSelected($event)"
  />
</div>
