<div class="calendar">
  <div class="calendar-header">
    <h2>{{ currentDate().toLocaleDateString('es-ES', { month: 'long', year: 'numeric' }) }}</h2>
  </div>
  <div class="days-grid">
    @for (entry of days; track entry.day) {
      <div class="day-column">
        <div class="day-column-header">{{ entry.label }}</div>
        @for (course of availableCoursesByDay().get(entry.day) ?? []; track course.id) {
          <div class="calendar-course available">
            <span class="calendar-course-name">{{ course.name }}</span>
            <span class="calendar-course-time">{{ course.startTime }} – {{ course.endTime }}</span>
          </div>
        }
      </div>
    }
  </div>
</div>
