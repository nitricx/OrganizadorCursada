<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Brand Primary Blue Gradient -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#185fa5"/>
    </linearGradient>

    <!-- Subtle Drop Shadow for depth on light backgrounds -->
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#glowShadow)">
    <!-- Cap Skull Base (underneath band) -->
    <path d="M 120,240 L 120,325 C 120,390 392,390 392,325 L 392,240" fill="none" stroke="url(#capGrad)" stroke-width="40" stroke-linecap="round"/>

    <!-- Cap Diamond Top (Maximized bounds) -->
    <polygon points="256,40 488,175 256,310 24,175" fill="url(#capGrad)"/>
    <polygon points="256,40 488,175 256,310 24,175" fill="none" stroke="#60a5fa" stroke-width="8" stroke-linejoin="round"/>

    <!-- Gold Tassel -->
    <path d="M 256,175 Q 435,210 448,300" fill="none" stroke="#fbbf24" stroke-width="14" stroke-linecap="round"/>
    <circle cx="448" cy="320" r="18" fill="#fbbf24"/>

    <!-- Bold White Checkmark (Materia Aprobada) -->
    <path d="M 185,175 L 238,228 L 335,125" fill="none" stroke="#ffffff" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
