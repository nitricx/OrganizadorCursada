<mat-sidenav-container class="app-container">
  <mat-sidenav mode="side" [opened]="isOpen()" role="navigation">
    <app-sidebar />
  </mat-sidenav>
  <mat-sidenav-content role="main">
    <mat-toolbar class="main-toolbar">
      <button mat-icon-button (click)="isOpen.update(v => !v)" aria-label="Alternar menú de navegación">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="app-brand-title">OrganizadorCursada</span>
      <span class="toolbar-spacer"></span>
      <app-career-selector />
      <app-user-menu />
      <button
        mat-icon-button
        class="theme-toggle-btn"
        (click)="toggleDarkMode()"
        [attr.aria-label]="isDarkMode() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
        [title]="isDarkMode() ? 'Modo Claro' : 'Modo Oscuro'"
      >
        <mat-icon>{{ isDarkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
    </mat-toolbar>
    <div class="wrap">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
<app-toast-container />
