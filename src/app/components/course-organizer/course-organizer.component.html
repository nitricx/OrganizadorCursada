<div class="course-organizer">
  <div class="header">
    <h2>
      Tecnicatura en Edición Audiovisual
      <button class="reset-btn" (click)="onReset()">Reiniciar</button>
    </h2>
  </div>

  <app-course-organizer-legend />

  <app-course-grid
    [courses]="courseService.courses()"
    [selectedIds]="courseService.selectedIds()"
    (cardClicked)="onCourseCardClicked($event)"
    (changeLessonClicked)="onChangeLessonRequested($event)"
    (mouseEntered)="onMouseEntered($event)"
    (mouseLeft)="onMouseLeft()"
  />

  <div class="info-bar" [innerHTML]="infoMessage()"></div>

  <app-lesson-selector-modal
    [course]="selectedCourseForModal()"
    [isOpen]="isModalOpen()"
    (closed)="closeModal()"
    (lessonSelected)="onLessonSelected($event)"
  />
</div>
