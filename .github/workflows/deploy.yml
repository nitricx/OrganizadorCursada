name: CI & Deployment Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate production environment configuration
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_USER_POOL_ID: ${{ secrets.AWS_USER_POOL_ID }}
          AWS_USER_POOL_WEB_CLIENT_ID: ${{ secrets.AWS_USER_POOL_WEB_CLIENT_ID }}
          AWS_COGNITO_OAUTH_DOMAIN: ${{ secrets.AWS_COGNITO_OAUTH_DOMAIN }}
          AWS_REDIRECT_SIGN_IN: ${{ secrets.AWS_REDIRECT_SIGN_IN }}
          AWS_REDIRECT_SIGN_OUT: ${{ secrets.AWS_REDIRECT_SIGN_OUT }}
          AWS_API_ENDPOINT: ${{ secrets.AWS_API_ENDPOINT }}
        run: npm run config:env

      - name: Build Angular Application
        run: npm run build

      - name: Configure AWS Credentials
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy static assets to Amazon S3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          aws s3 sync dist/OrganizadorCursada/browser s3://${{ secrets.AWS_S3_BUCKET }} --delete

      - name: Invalidate CloudFront CDN Cache
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

