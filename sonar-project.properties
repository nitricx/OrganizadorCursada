# SonarQube / SonarCloud Configuration for OrganizadorCursada
sonar.projectKey=nitricx_OrganizadorCursada
sonar.projectName=OrganizadorCursada

# Source and Test Inclusions / Exclusions
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,public/**,src/environments/**,**/*.spec.ts,coverage/**

# Code Coverage (LCOV Report from Vitest)
sonar.javascript.lcov.reportPaths=coverage/OrganizadorCursada/lcov.info,coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8
