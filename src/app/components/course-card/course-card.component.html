<div
  [class]="'materia ' + course().status + highlightClass()"
  [attr.id]="'mat-' + course().id"
  [class.available]="allRequirementsMet() && course().status === 'pending'"
  (click)="onCardClick()"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()"
  role="button"
  tabindex="0"
>
  <span>{{ course().name }}</span>
  @if (statusTag()) {
    <span class="tag">{{ statusTag() }}</span>
  }
</div>
