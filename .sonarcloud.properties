# ====================================================================
# SonarQube Cloud (SonarCloud) Configuration for Automatic Analysis
# ====================================================================
sonar.projectKey=nitricx_OrganizadorCursada
sonar.organization=nitricx

# Analysis scope
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=\
  node_modules/**,\
  dist/**,\
  coverage/**,\
  public/**,\
  src/environments/**,\
  scripts/**,\
  **/*.spec.ts,\
  **/*.css

# Coverage exclusions per Inviolable Rule #2
sonar.coverage.exclusions=\
  src/main.ts,\
  src/app/app.config.ts,\
  src/app/app.routes.ts,\
  src/app/features/**/*.html,\
  src/app/features/**/*.component.ts,\
  src/app/shared/**/*.html,\
  src/app/shared/**/*.component.ts,\
  src/environments/**,\
  scripts/**
