<mat-nav-list role="navigation" aria-label="Main navigation">
  @for (item of items(); track item.label) {
    @if (item.children && item.children.length > 0) {
      <mat-expansion-panel class="sidebar-expansion-panel" [hideToggle]="false">
        <mat-expansion-panel-header>
          <mat-panel-title>
            {{ item.label }}
          </mat-panel-title>
        </mat-expansion-panel-header>
        <mat-nav-list class="nested-nav-list">
          @for (child of item.children; track child.route) {
            <a
              mat-list-item
              [routerLink]="child.route"
              routerLinkActive="active-link"
              #childLink="routerLinkActive"
              [activated]="childLink.isActive"
              [attr.aria-current]="childLink.isActive ? 'page' : null"
            >
              <span matListItemTitle>{{ child.label }}</span>
            </a>
          }
          @if (item.addButton) {
            <button mat-list-item aria-label="Agregar" (click)="addPlan(item)">
              <mat-icon matListItemIcon>add</mat-icon>
            </button>
          }
        </mat-nav-list>
      </mat-expansion-panel>
    } @else {
      <a
        mat-list-item
        [routerLink]="item.route"
        routerLinkActive="active-link"
        #link="routerLinkActive"
        [activated]="link.isActive"
        [attr.aria-current]="link.isActive ? 'page' : null"
      >
        <span matListItemTitle>{{ item.label }}</span>
      </a>
    }
  }
</mat-nav-list>
